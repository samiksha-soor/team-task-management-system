<div class="notification-bell">
  <button type="button" class="bell-button" (click)="toggle()" aria-label="Notifications">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
    </svg>
    <span class="badge" *ngIf="unreadCount > 0">{{ unreadCount > 9 ? '9+' : unreadCount }}</span>
  </button>

  <div class="dropdown" *ngIf="isOpen">
    <div class="dropdown-header">
      <span>Notifications</span>
      <button type="button" class="mark-all" *ngIf="unreadCount > 0" (click)="markAllAsRead($event)">Mark all read</button>
    </div>

    <div class="dropdown-list">
      <div
        class="notification-item"
        *ngFor="let n of notifications"
        [class.unread]="!n.isRead"
        (click)="selectNotification(n)"
      >
        <p class="message">{{ n.message }}</p>
        <span class="time">{{ n.createdAt | date:'short' }}</span>
      </div>
      <div class="empty" *ngIf="notifications.length === 0">No notifications yet.</div>
    </div>
  </div>
</div>
