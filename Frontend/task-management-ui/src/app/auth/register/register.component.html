<div class="auth-container">
  <form class="auth-card" [formGroup]="form" (ngSubmit)="onSubmit()">
    <h2>Create account</h2>

    <label>Full name</label>
    <input type="text" formControlName="fullName" placeholder="Jane Doe" />

    <label>Email</label>
    <input type="email" formControlName="email" placeholder="you@example.com" />

    <label>Password</label>
    <div class="password-field">
      <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="At least 6 characters" />
      <button
        type="button"
        class="toggle-password"
        (click)="showPassword = !showPassword"
        [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
      >
        <svg *ngIf="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <svg *ngIf="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        </svg>
      </button>
    </div>

    <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>

    <button type="submit" [disabled]="form.invalid || loading">
      {{ loading ? 'Creating...' : 'Register' }}
    </button>

    <p class="switch">Already have an account? <a routerLink="/login">Sign in</a></p>
  </form>
</div>
