

name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  backend-build-and-test:
    name: Backend - Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: dotnet restore
        working-directory: Backend

      - name: Build (Release configuration)
        run: dotnet build --no-restore --configuration Release
        working-directory: Backend

      - name: Run unit tests

        run: >
          dotnet test --no-build --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
        working-directory: Backend

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: Backend/TaskManagementAPI.Tests/TestResults

  frontend-build:
    name: Frontend - Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/task-management-ui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Frontend/task-management-ui

      - name: Build production bundle
        run: npm run build -- --configuration production
        working-directory: Frontend/task-management-ui

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/task-management-ui/dist

  docker-build:
    name: Docker - Build Images
    needs: [ backend-build-and-test, frontend-build ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t task-management-api:${{ github.sha }} ./Backend/TaskManagementAPI

      - name: Build frontend image
        run: docker build -t task-management-ui:${{ github.sha }} ./Frontend/task-management-ui

