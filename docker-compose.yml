version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tms-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong@Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:

      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: ./Backend/TaskManagementAPI
    container_name: tms-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=TaskManagementDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;"
      JwtSettings__Secret: "PRODUCTION_REPLACE_THIS_WITH_A_LONG_RANDOM_SECRET_VALUE_32PLUS"
      ASPNETCORE_ENVIRONMENT: "Production"
    ports:
      - "8080:8080"

  frontend:
    build: ./Frontend/task-management-ui
    container_name: tms-frontend
    depends_on:
      - api
    ports:
      - "4200:80"

volumes:
  sql_data:
